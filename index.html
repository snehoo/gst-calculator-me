        <p>Free online GST calculator for India. Add or remove GST instantly for all GST 2.0 slabs — 0%, 5%, 18%, 40% (effective September 22, 2025). Shows CGST + SGST split for intra-state or IGST for inter-state. No login required.</p>

        <h2>GST 2.0 Slabs (effective September 22, 2025 — 56th GST Council, CBIC)</h2>
        <ul>
          <li><strong>0% (Nil):</strong> Essential food grains, fresh milk, vegetables, eggs, health &amp; life insurance premiums</li>
          <li><strong>5%:</strong> Packaged foods, medicines, bicycles, textiles ≤₹2,500, footwear ≤₹1,000, small restaurants</li>
          <li><strong>18%:</strong> Electronics, AC restaurants, IT &amp; telecom services, vehicles ≤350cc, small/mid cars, cement</li>
          <li><strong>40%:</strong> Tobacco, pan masala, caffeinated aerated drinks, high-end SUVs &gt;2500cc, yachts, private aircraft</li>
        </ul>
        <p>Note: The old 12% slab is abolished (items moved to 5% or 18%). The old 28% slab is replaced by 40%. Gold remains 3%, rough diamonds 0.25%.</p>

        <h2>How to Calculate GST — Formulas</h2>
        <p><strong>Adding GST (exclusive):</strong> GST Amount = (Base Amount × GST Rate%) ÷ 100. Example: 18% GST on ₹1,000 = ₹180; total payable = ₹1,180.</p>
        <p><strong>Removing GST (inclusive / reverse):</strong> Base = Total × 100 ÷ (100 + Rate%). Example: ₹1,180 inclusive of 18% → base = ₹1,000; GST = ₹180.</p>
        <p><strong>Intra-state split:</strong> 18% = 9% CGST + 9% SGST. <strong>Inter-state:</strong> 18% IGST (no split).</p>

        <h2>Frequently Asked Questions</h2>
        <h3>What are the GST slabs in India after GST 2.0?</h3>
        <p>Four slabs: 0%, 5%, 18%, 40%. The 12% and 28% slabs were abolished effective September 22, 2025 per the 56th GST Council notification.</p>
        <h3>How do I calculate 18% GST on ₹1,00,000?</h3>
        <p>GST = ₹1,00,000 × 18 ÷ 100 = ₹18,000. Total payable = ₹1,18,000. Intra-state: ₹9,000 CGST + ₹9,000 SGST. Inter-state: ₹18,000 IGST.</p>
        <h3>How do I remove GST from a price?</h3>
        <p>Base = Total × 100 ÷ (100 + Rate). For ₹1,18,000 at 18%: Base = ₹1,18,000 × 100 ÷ 118 = ₹1,00,000. GST portion = ₹18,000.</p>
        <h3>What is the GST registration threshold in India?</h3>
        <p>Goods suppliers with annual turnover above ₹40 lakh must register for GST. Service providers above ₹20 lakh must register (per CBIC 2025-26 thresholds).</p>
        <h3>When does CGST/SGST apply vs IGST?</h3>
        <p>CGST + SGST apply when supplier and place of supply are in the same state. IGST applies when they are in different states or for imports/exports.</p>
